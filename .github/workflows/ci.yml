name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=main --cov-report=xml --cov-report=term

      - name: CLI smoke test
        run: |
          python main.py version
          python main.py --no-banner scan nbk-login-verify.xyz --json --no-persist | python -c "import json,sys; d=json.load(sys.stdin); assert d['phishing']['is_phishing'], d"
          python main.py --no-banner config --json > /dev/null

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install flake8 black
      - run: flake8 src/ tests/ main.py
      - run: black --check src/ tests/ main.py

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t brandsentra:test .
      - name: Test container health
        run: |
          docker run -d --name brandsentra-test -p 5000:5000 brandsentra:test
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/api/v1/health; then break; fi
            sleep 2
          done
          curl -f http://localhost:5000/api/v1/health
          curl -f http://localhost:5000/metrics > /dev/null
          docker logs brandsentra-test
          docker stop brandsentra-test
